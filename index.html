<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 幼儿英文启蒙 · 互动资源库</title>
    <style>
        /* ... 所有样式与之前保持一致，为节省篇幅此处省略，您可以从之前提供的完整代码中复制样式 ... */
        /* 但请务必保留以下新增的欢迎遮罩样式 */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }
        #welcome-overlay .big-emoji { font-size: 4rem; margin-bottom: 1rem; }
        #welcome-overlay .title { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        #welcome-overlay .sub { font-size: 1.2rem; opacity: 0.9; }
        #welcome-overlay .tap-hint { margin-top: 2rem; font-size: 1rem; background: rgba(255,255,255,0.2); padding: 0.5rem 1.5rem; border-radius: 40px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        /* 其他样式不变 */
    </style>
</head>
<body>
    <!-- 欢迎遮罩 - 用于激活音频上下文 -->
    <div id="welcome-overlay">
        <div class="big-emoji">🧸</div>
        <div class="title">英文启蒙 · 互动资源库</div>
        <div class="sub">点击任意处开始 · 畅享语音学习</div>
        <div class="tap-hint">👆 点击屏幕激活音频</div>
    </div>

    <!-- ... 原有的页面内容 (container, modules-grid, modal等) 请从您之前的完整代码中保留 ... -->

    <script>
    (function() {
        // ========== 全局控制 ==========
        let currentUtterance = null;
        let audioContext = null;

        // ========== 检测环境 ==========
        function isWechat() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        // ========== 核心语音播放函数 (增强版) ==========
        function speakText(text, times = 1, callback) {
            // 1. 取消当前播放
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            if (currentUtterance) {
                currentUtterance = null;
            }

            // 2. 尝试使用 SpeechSynthesis API
            try {
                let count = 0;
                function speak() {
                    if (count >= times) {
                        if (callback) callback();
                        return;
                    }
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.7;
                    utterance.pitch = 1.1;
                    currentUtterance = utterance;
                    utterance.onend = function() {
                        count++;
                        currentUtterance = null;
                        if (count < times) {
                            setTimeout(speak, 300);
                        } else {
                            if (callback) callback();
                        }
                    };
                    utterance.onerror = function(e) {
                        console.warn('SpeechSynthesis error:', e);
                        currentUtterance = null;
                        count++;
                        // 如果 SpeechSynthesis 失败，尝试 Web Audio 降级
                        if (count < times) {
                            setTimeout(speak, 300);
                        } else {
                            // 播放降级提示音
                            playFallbackBeep();
                            // 显示提示弹窗
                            showModal('🔊 语音合成失败，请确保您的浏览器支持并允许音频播放。\n\n您可以尝试：\n1. 使用 Chrome 或 Safari 浏览器\n2. 检查系统音量设置\n3. 点击页面其他区域重试');
                            if (callback) callback();
                        }
                    };
                    window.speechSynthesis.speak(utterance);
                }
                speak();
            } catch (e) {
                console.warn('SpeechSynthesis not available:', e);
                playFallbackBeep();
                showModal('🔊 您的浏览器不支持语音合成，请使用最新版 Chrome 或 Safari。');
                if (callback) callback();
            }
        }

        // ========== 降级方案：Web Audio 提示音 ==========
        function playFallbackBeep() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                // 确保 AudioContext 是激活状态
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch(e) {
                console.warn('Fallback audio failed:', e);
            }
        }

        // ========== 欢迎遮罩：激活音频上下文 ==========
        const welcomeOverlay = document.getElementById('welcome-overlay');
        if (welcomeOverlay) {
            welcomeOverlay.addEventListener('click', function() {
                // 初始化 AudioContext (如果浏览器支持)
                try {
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioContext.state === 'suspended') {
                        audioContext.resume();
                    }
                } catch(e) {}
                // 播放一个静音片段来“激活”语音合成
                try {
                    const silent = new SpeechSynthesisUtterance(' ');
                    silent.volume = 0;
                    window.speechSynthesis.speak(silent);
                } catch(e) {}
                // 隐藏遮罩
                this.style.display = 'none';
            });
        }

        // ========== 模块1：字母 (增强口型显示) ==========
        // ... 字母生成逻辑与之前相同，但 mouthShapes 对象已包含更详细的描述 ...
        // 请从您之前的完整代码中复制 mouthShapes 和 letterGrid 生成逻辑

        // ========== 对话框控制 (与之前相同) ==========
        const modalOverlay = document.getElementById('modalOverlay');
        const modalText = document.getElementById('modalText');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function showModal(text) {
            if (!modalOverlay) return;
            modalText.textContent = text;
            modalOverlay.classList.add('show');
        }

        function hideModal() {
            if (!modalOverlay) return;
            modalOverlay.classList.remove('show');
        }

        if (modalCloseBtn) {
            modalCloseBtn.addEventListener('click', hideModal);
        }
        if (modalOverlay) {
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) hideModal();
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') hideModal();
        });

        // ========== 模块4：计划播放 (与之前相同，但使用增强的 speakText) ==========
        // ... 您的 songLyrics, listeningTexts, renderSchedule 等逻辑保持不变 ...

        // ========== 初始化所有模块 ==========
        // ... 您之前的所有渲染逻辑 (renderVocab, renderSentences, renderSchedule) 保持不变 ...

        // ========== 微信提示 ==========
        if (isWechat()) {
            const tip = document.getElementById('browserTip');
            if (tip) tip.style.display = 'block';
        }

        console.log('✅ 资源库已加载，点击欢迎遮罩后音频功能将激活。');
    })();
    </script>
</body>
</html>
